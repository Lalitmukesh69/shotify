[workspace]
resolver = "2"
members = [
  "crates/shotify-core",
  "crates/shotify-annotate",
  "crates/shotify-export",
  "crates/shotify-app",
  "src-tauri",
]

[workspace.package]
version = "1.0.0"
authors = ["Lalit mukesh", "webadderall (shotify)"]
license = "GPL-3.0"
edition = "2021"
rust-version = "1.87"

[workspace.dependencies]
ab_glyph = "0.2"
arboard = "3"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "screenshot", "global_shortcuts", "open_uri"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures-util = "0.3"
glam = "0.34"
glib = "0.18"
global-hotkey = "0.7"
gtk = "0.18"
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "fira-sans", "auto-detect-theme", "canvas", "image", "lazy", "svg", "tokio", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
kurbo = "0.13"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std"] }
palette = "0.7"
raw-window-handle = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tiny-skia = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
toml = "0.8"
tracing = "0.1"
tray-icon = { version = "0.21", default-features = false }
uuid = { version = "1", features = ["v4"] }
webp = "0.3"
window-vibrancy = "0.7"
xcap = "0.3.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
