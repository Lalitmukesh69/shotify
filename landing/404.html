<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Page Not Found | shotify</title>
  <meta name="description" content="The page you were looking for could not be found. Return to the shotify screenshot studio home page.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="images/shotstylelogo.svg">
  <link rel="apple-touch-icon" href="images/app-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-base: #000000;
      --surface-1: #181818;
      --surface-2: #1F1F1F;
      --surface-3: #272727;
      --surface-hover: #313131;
      --border-card: #272727;
      --text-primary: #FFFFFF;
      --text-secondary: #9B9B9B;
      --text-muted: #606266;
      --font-sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Geist Mono', monospace;
      --ease-base: cubic-bezier(0.22, 1, 0.36, 1);
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 120px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: 14px;
      color: #8771FF;
      background-color: var(--surface-1);
      border: 1px solid var(--border-card);
      border-radius: 9999px;
      padding: 4px 16px;
      font-weight: 600;
    }

    h1 {
      font-size: 48px;
      line-height: 48px;
      font-weight: 600;
      letter-spacing: -0.025em;
      text-wrap: balance;
      background: linear-gradient(90deg, #FFFFFF 0%, #9B9B9B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: var(--text-secondary);
      font-size: 16px;
      line-height: 24px;
      text-wrap: pretty;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      padding: 10px 18px;
      text-decoration: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 15px;
      transition: background-color 300ms var(--ease-base);
      background-color: #FFFFFF;
      color: #000000;
      margin-top: 8px;
    }
    .btn:hover {
      background-color: #E6E6E6;
    }

    footer {
      border-top: 1px solid var(--border-card);
      padding: 24px;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main class="container">
    <span class="error-code">ERROR 404</span>
    <h1>Page not located</h1>
    <p>The link you followed may be outdated or the page has moved. Return to the shotify homepage to continue styling screenshots.</p>
    <a href="./" class="btn">Return to homepage</a>
  </main>

  <footer>
    <p>© 2026 shotify contributors · Open source under GNU GPL 3.0</p>
  </footer>
</body>
</html>
